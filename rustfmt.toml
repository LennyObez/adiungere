# Stable options only, so that formatting works on the pinned compiler without a nightly toolchain.
#
# At the repository root rather than beside the workspace, because the formatter searches from the current
# directory upwards. Beside the workspace it would be found when a command ran from there and missed when the
# same command ran from the root, and the two would then disagree about what formatted code looks like.

edition = "2024"
max_width = 110
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
match_block_trailing_comma = true
