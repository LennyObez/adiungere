[package]
name = "adiungere-cli"
description = "The adiungere command line: the executable specification of what the product claims."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "adiungere_cli"
path = "src/lib.rs"

[[bin]]
name = "adiungere"
path = "src/main.rs"

[dependencies]
adiungere-isobmff = { path = "../adiungere-isobmff" }
adiungere-manifest = { path = "../adiungere-manifest" }
adiungere-scan = { path = "../adiungere-scan" }
clap = { workspace = true }
ctrlc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
adiungere-fixtures = { path = "../adiungere-fixtures" }

[lints]
workspace = true
