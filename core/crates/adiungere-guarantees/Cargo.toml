[package]
name = "adiungere-guarantees"
description = "The properties this repository refuses to let anyone break, each expressed as a test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "adiungere_guarantees"
path = "src/lib.rs"

# The guarantees ask the product's own crates to read the evidence register, the roadmap and the synthetic
# recordings, rather than reimplementing any of them. A second implementation would agree with the first
# until the day it mattered.
[dev-dependencies]
adiungere-cli = { path = "../adiungere-cli" }
adiungere-fingerprint = { path = "../adiungere-fingerprint" }
adiungere-fixtures = { path = "../adiungere-fixtures" }
adiungere-isobmff = { path = "../adiungere-isobmff" }
adiungere-manifest = { path = "../adiungere-manifest" }
adiungere-scan = { path = "../adiungere-scan" }
serde_json = { workspace = true }
# The licence text is compared by digest against its canonical publication, not by a handful of markers a
# one-word edit would leave intact.
sha2 = { workspace = true }

[lints]
workspace = true
