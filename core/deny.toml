# Supply-chain policy for the core.
#
# The outbound licence is Apache-2.0 (ADR-0003), so the allow list holds permissive licences compatible with
# it. Reciprocal licences are not listed and are therefore refused, which is the mechanism that keeps a
# general-purpose media library out of the graph (ADR-0002).
#
# Every version in Cargo.toml is exact and the lock file is committed, so this file guards what those
# versions bring with them.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# An ignored advisory is a decision, not a convenience. Each entry carries the reason and the date it was
# taken, and is revisited when the dependency moves.
ignore = [
    # The RSA crate's private-key operations leak timing. It reaches this graph only through the provenance
    # library's pure-Rust cryptography, where it verifies RSA signatures made by others; no RSA private key
    # is ever used by this product, because the credential type refuses RSA algorithms while this stands.
    # No fixed release exists (checked 2026-09-17); revisited when one does.
    { id = "RUSTSEC-2023-0071", reason = "verification only; RSA signing is refused by adiungere-provenance until the crate is fixed" },
    # A procedural macro reached through the provenance library's IRI crates. It runs when the code is
    # compiled and links nothing into the product. Revisited at each update of the provenance library
    # (decided 2026-09-17).
    { id = "RUSTSEC-2024-0370", reason = "build-time macro, nothing of it ships; carried by the provenance library" },
]

[licenses]
confidence-threshold = 0.93
# The allow list is a policy, not an inventory of what the graph happens to contain today. An entry nothing
# matches is a licence this project would accept if a dependency arrived under it, which is the point.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    # The University of Illinois/NCSA licence: permissive, attribution only, the terms of the fuzzing engine
    # the fuzzing project links. That project is checked with this same file.
    "NCSA",
    # The Community Data License Agreement, permissive: the terms of the root certificate store the
    # time-stamp request's HTTP client carries, which is data rather than code.
    "CDLA-Permissive-2.0",
]
# No exception. An exception here would be a crate whose licence the policy refuses, kept anyway.
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# A crate inside this workspace is reached by path and is never published, so it has no version requirement to
# pin and no registry to resolve from. The wildcard rule exists to stop a published crate depending on "any
# version" of something from a registry, which this cannot be.
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = []
skip = []
# The provenance library's own graph carries two lines of several crates, which its authors and not this
# project decide. The rule stays for everything else: a duplicate reached through any other path is
# refused. Revisited at each update of the library (decided 2026-09-17).
skip-tree = [{ crate = "c2pa", reason = "duplicates inside the provenance library's graph are its authors' to resolve" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
