# The toolchain is pinned patch-exact, in this file and nowhere else.
#
# A pipeline that names a version in its own configuration can drift from this one, and the drift is silent:
# the pipeline stays green on a compiler nobody develops against. Guarantee G07 refuses any workflow that
# restates a version, so every job takes the pin from here.
#
# The components are the ones a check uses today. A component nothing uses is a download every contributor
# pays for a check that does not exist; when the release binary is inspected for encoder symbols at M2, the
# tool that does it joins this list in the same change as the check.

[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
