# The toolchain is pinned patch-exact, in this file and nowhere else.
#
# A pipeline that names a version in its own configuration can drift from this one, and the drift is silent:
# the pipeline stays green on a compiler nobody develops against. Guarantee G07 refuses any workflow that
# restates a version, so every job takes the pin from here.
#
# `llvm-tools` is listed because the release binary is inspected for symbols it must not contain, and the
# tool that does it has to be the one shipped with the pinned compiler rather than whatever the host has.

[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "llvm-tools"]
profile = "minimal"
