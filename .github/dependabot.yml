version: 2

updates:
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A release is adopted a week after it appears, not the day it does. A version pulled the day after
    # publication is the one most likely to be yanked, and a week costs nothing a pinned graph needs.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - rust
    groups:
      cargo:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - '*'

# The npm, gradle and swift ecosystems are added with the manifests they read, in M4, M7 and M8. Declaring an
# ecosystem whose manifest does not exist makes the update bot log an error on every run, which trains
# everyone to ignore its reports.
