name: Repository

# This workflow carries no path filter, on purpose. The guarantees it runs assert properties of the whole
# repository: which files may exist, which characters they may contain, that every directory holding source
# is built by some pipeline, that every documentation link resolves. Putting them behind a filter would mean
# a change under docs/ or .github/ could break one of them with no pipeline noticing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  # Never cancel a run on the default branch: a merged commit whose checks never finished leaves the branch
  # in a state nobody measured.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guarantees:
    name: Repository guarantees
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version is named here. The toolchain file at the repository root is the only place one exists, and
      # a guarantee refuses any workflow that restates or overrides it.
      - name: Resolve the pinned toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      # The guarantee that the fingerprints equal their references runs the reference script with the
      # interpreter pinned in tools/versions.toml and the media tool pinned there, and it fails rather than
      # skips when either is absent. So this job fetches both, the same way the core workflow does.
      - name: Read the pinned interpreter line
        id: interpreter
        run: |
          line=$(awk '$0 == "[python]" { inside = 1; next } /^\[/ { inside = 0 } inside && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' tools/versions.toml)
          test -n "$line"
          printf 'line=%s\n' "$line" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.interpreter.outputs.line }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ hashFiles('tools/versions.toml') }}

      - name: Fetch the pinned external tools
        run: scripts/fetch-tools.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      # The guarantee suite lists tracked files through git, so it needs a real checkout rather than a
      # sparse one, and it fails loudly if git returns nothing rather than reporting success on an empty
      # scan.
      - name: Run the guarantee suite
        working-directory: core
        run: cargo test -p adiungere-guarantees --tests

      - name: The evidence register agrees with the roadmap
        working-directory: core
        run: cargo run --quiet -p adiungere-cli -- probes check

  title:
    name: Pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # A milestone lands on the default branch as one squash commit whose subject is the pull request title,
    # so the title has to be the commit subject the contribution guide describes: a type, an optional scope,
    # and a subject that starts with a lower-case letter or a digit, carries no trailing full stop, and fits
    # in seventy-two characters. An acronym inside the subject is left alone.
    if: github.event_name == 'pull_request'

    steps:
      - name: The title is a Conventional Commits subject
        env:
          # Read through the environment, never interpolated into the script: a title is text an outside
          # contributor writes.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          pattern='^(feat|fix|perf|refactor|docs|test|chore|security)(\([a-z0-9-]+\))?: [a-z0-9].*[^.]$'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            printf 'The pull request title is not a Conventional Commits subject.\n'
            printf 'Expected: <type>(<scope>): <subject>, starting lower-case, no trailing full stop.\n'
            printf 'Types: feat, fix, perf, refactor, docs, test, chore, security.\n'
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            printf 'The pull request title is %s characters long; the limit is 72.\n' "${#TITLE}"
            exit 1
          fi
          printf 'The title is a well-formed subject.\n'
