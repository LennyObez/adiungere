name: Analysis

# Code scanning and dependency review.
#
# Code scanning is a required check: a pull request does not merge while the scanner cannot run. That is a
# deliberate trade. A scanner that cannot run on a change is a change nobody has looked at with that tool,
# and the cost of waiting for it is minutes. Findings themselves are triaged rather than merged around.
#
# The workflow language matters as much as the Rust one here. A pipeline in this repository can write labels,
# and a later one will publish releases, so a workflow that interpolates untrusted text into a shell command
# is a real finding rather than a theoretical one.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 2'

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  code_scanning:
    name: Code scanning (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      # One language failing must not hide the other's result.
      fail-fast: false
      matrix:
        language: [actions, rust]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        env:
          # The tests are where this repository starts processes and reads files, so the extractor has to see
          # them. Without this it reads the library and binary targets only.
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_ALL_TARGETS: 'true'
        with:
          languages: ${{ matrix.language }}
          # Source analysis, so nothing is compiled here and no compiler version is named. The build is the
          # core workflow's job.
          build-mode: none
          queries: security-extended
          # A recording is an input this product cannot trust, and it arrives from the local file system. The
          # default threat model treats only remote input as untrusted, which would make the box reader's
          # entire attack surface invisible to the queries. The file contents are therefore a source. The
          # command line and the environment are not: this is a tool that opens the file the person names,
          # and whoever chooses that name already runs code as that person.
          config: |
            threat-models:
              - file

      - name: Analyse
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: /language:${{ matrix.language }}

  dependency_review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only a pull request has two commits to compare, which is what this reviews.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The licence list is the same policy the supply-chain workflow enforces over the resolved graph, and a
      # guarantee refuses the two drifting apart. Stating it here means a pull request that adds a dependency
      # under other terms says so in the review rather than in a log.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: >-
            0BSD, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC, MIT,
            MPL-2.0, NCSA, Unicode-3.0, Zlib
          # The licence policy governs what the product links and ships. A pipeline action runs on the
          # build machine and ships nothing, so an action under a reciprocal licence is exempted here by
          # name, and a guarantee refuses any exemption that is not a pipeline action.
          allow-dependencies-licenses: >-
            pkg:githubactions/Swatinem/rust-cache
